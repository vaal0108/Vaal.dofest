name: Actualizar DOF Diario

on:
  schedule:
    # 15:00 UTC (10:00 AM Cancún/Q.Roo) y 19:00 UTC (2:00 PM Cancún/Q.Roo) de Lunes a Viernes
    - cron: '0 15 * * 1-5'
    - cron: '0 19 * * 1-5'
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

concurrency:
  group: actualizar-dof
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar el script (Generar DOF)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TZ: America/Cancun
      run: |
        python dof-estudiantes.py

    - name: Subir los cambios a GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add Resumenes_Semanales index.html
        git diff --staged --quiet || (git commit -m "Actualizacion automatica del DOF" && git pull --rebase origin main && git push)
